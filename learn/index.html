const SALT = "TmCUhsrx8RgOPVuJTuYb+g==";
const IV = "s3cjuVer1zb6vrIP";
const RK = 'zrj_v2_key';

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function derive(pw) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64d(SALT), iterations: 200000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}

async function open(pw, remember) {
  const key = await derive(pw);
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64d(IV) }, key, b64d(PAYLOAD));
  const html = new TextDecoder().decode(plain);
  if (remember) { try { localStorage.setItem(RK, pw); } catch (e) {} }
  document.open(); document.write(html); document.close();
}

async function unlock(e) {
  e.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = '解锁中…'; err.textContent = '';
  try {
    await open(document.getElementById('pw').value, document.getElementById('rm').checked);
  } catch (ex) {
    err.textContent = '密码不对';
    btn.disabled = false; btn.textContent = '解锁';
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
  return false;
}

// 记住过的设备自动解锁
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(RK); } catch (e) {}
  if (saved) {
    try { await open(saved, false); }
    catch (ex) { try { localStorage.removeItem(RK); } catch (e) {} }
  }
})();
