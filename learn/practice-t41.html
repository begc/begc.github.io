const SK='zrj_k',RK='zrj_v4_key',FRAG='k';

// 1.4MB payload 用 Uint8Array.from(atob(s),fn) 会逐字符回调百万次，慢十几秒。
// 直接循环 + 预分配，快一个数量级。
function b64d(s){const b=atob(s),n=b.length,o=new Uint8Array(n);
  for(let i=0;i<n;i++)o[i]=b.charCodeAt(i);return o}

async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),
    'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64d(S),iterations:200000,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']);
}

// ⚠️ file:// 下每个文件是独立 origin，sessionStorage/localStorage 不共享。
// 实测过：从 index.html 跳到 s01.html，storage 全是空的。
// 所以 file:// 下密钥走 URL fragment（#k=密码）——fragment 不发到服务器；
// http(s) 下 storage 正常，优先用 storage（地址栏更干净）。
const isFile = location.protocol === 'file:';

function fragPw(){
  const m=location.hash.match(new RegExp('[#&]'+FRAG+'=([^&]*)'));
  return m?decodeURIComponent(m[1]):null;
}
function savePw(pw){
  try{ sessionStorage.setItem(SK,pw) }catch(e){}
  try{ localStorage.setItem(RK,pw) }catch(e){}
}
function loadPw(){
  const f=fragPw(); if(f) return f;
  try{ const v=sessionStorage.getItem(SK); if(v) return v }catch(e){}
  try{ const v=localStorage.getItem(RK); if(v) return v }catch(e){}
  return null;
}
// file:// 下给站内链接带上密钥，这样点过去自动解锁。
// ⚠️ 要处理已有锚点的链接（stages.html#G1）——不能直接拼，
// 否则变成 stages.html#G1#k=...，第二个 # 后面解析不出来。
// 解法：把密钥作为 & 参数追加到已有 hash 后面（fragKey 的正则同时匹配 # 和 &）。
function propagate(pw){
  if(!isFile) return;
  const kv=FRAG+'='+encodeURIComponent(pw);
  for(const a of document.querySelectorAll('a[href]')){
    const h=a.getAttribute('href');
    if(!h || h.startsWith('http') || h.indexOf(FRAG+'=')>=0) continue;
    const hi=h.indexOf('#');
    if(hi<0){
      // 无锚点：foo.html → foo.html#k=pw
      if(h.endsWith('.html')) a.setAttribute('href',h+'#'+kv);
    }else if(h.slice(0,hi).endsWith('.html')){
      // 有锚点：stages.html#G1 → stages.html#G1&k=pw
      a.setAttribute('href',h+'&'+kv);
    }
  }
}

async function open_(pw){
  const key=await derive(pw);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(IV)},key,b64d(P));
  const html=new TextDecoder().decode(plain);
  savePw(pw);

  // ⭐ 关键：write 之前先把密钥写进 URL hash。
  // 因为 document.write 之后本脚本的上下文就销毁了（setTimeout / window 变量全丢，
  // 这是实测踩到的坑），所以只能靠 URL 把密钥交给新页面——
  // 页面自己的 KEYPROP 脚本会读 hash、补链接、然后把密钥从地址栏抹掉。
  if(isFile && location.hash.indexOf(FRAG+'=')<0){
    const kv=FRAG+'='+encodeURIComponent(pw);
    const cur=location.hash.slice(1);
    try{ history.replaceState(null,'',
      location.pathname+location.search+'#'+(cur?cur+'&'+kv:kv)); }catch(e){}
  }
  document.open();document.write(html);document.close();
}

async function go(e){
  e.preventDefault();
  const btn=document.getElementById('btn'),err=document.getElementById('err');
  btn.disabled=true;btn.textContent='解锁中…';err.textContent='';
  try{
    await open_(document.getElementById('pw').value);
  }catch(ex){
    err.textContent='密码不对';
    btn.disabled=false;btn.textContent='解锁';
    const i=document.getElementById('pw');i.value='';i.focus();
  }
  return false;
}

// 自动解锁
(async()=>{
  const pw=loadPw();
  if(!pw) return;
  try{ await open_(pw) }
  catch(ex){
    try{sessionStorage.removeItem(SK)}catch(e){}
    try{localStorage.removeItem(RK)}catch(e){}
  }
})();
